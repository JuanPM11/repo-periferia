<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agente · Registro como Proveedor</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --borde: #2a2f3a;
    --texto: #e7eaf0; --tenue: #9aa3b2; --acento: #5b9dff; --ok: #3fb860;
    --err: #ff6b6b; --warn: #ffb020; --warnbg: #2a2213;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--borde);
    display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .salud { margin-left: auto; font-size: 12px; color: var(--tenue); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--tenue); margin-right: 5px; vertical-align: middle; }
  .dot.ok { background: var(--ok); } .dot.no { background: var(--err); }
  main { max-width: 820px; margin: 0 auto; padding: 20px; }
  #chat { display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px; }
  .msg { max-width: 92%; padding: 11px 14px; border-radius: 12px; white-space: pre-wrap;
    word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--acento); color: #06142e; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--borde); }
  .msg.bot.confirm { border-color: var(--warn); background: var(--warnbg); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .3px;
    color: #06142e; background: var(--warn); padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; }
  .tool { align-self: flex-start; max-width: 92%; background: var(--panel2);
    border: 1px solid var(--borde); border-left: 3px solid var(--acento);
    border-radius: 8px; padding: 9px 12px; font-size: 13px; }
  .tool.err { border-left-color: var(--err); }
  .tool .t-head { display: flex; align-items: center; gap: 8px; }
  .tool code { color: var(--acento); font-weight: 600; }
  .tool.err code { color: var(--err); }
  .tool .estado { font-size: 11px; color: var(--tenue); margin-left: auto; }
  .tool pre { margin: 6px 0 0; color: var(--tenue); white-space: pre-wrap;
    word-break: break-word; font-size: 12px; }
  .pensando { align-self: flex-start; color: var(--tenue); font-style: italic; }
  form { display: flex; gap: 10px; position: sticky; bottom: 0; background: var(--bg);
    padding: 14px 0; border-top: 1px solid var(--borde); }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--texto);
    border: 1px solid var(--borde); border-radius: 10px; padding: 11px 13px; font: inherit; }
  button { background: var(--acento); color: #06142e; border: 0; border-radius: 10px;
    padding: 0 18px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { color: var(--tenue); font-size: 12px; margin: 0 0 14px; }
  .confirm-acciones { display: flex; gap: 8px; margin-top: 10px; }
  .confirm-acciones button.sec { background: var(--panel2); color: var(--texto); border: 1px solid var(--borde); }
</style>
</head>
<body>
<header>
  <h1>Agente · Registro como Proveedor</h1>
  <span class="salud"><span id="dot" class="dot"></span><span id="salud-txt">conectando…</span></span>
</header>
<main>
  <p class="hint">Ejemplo: <em>Procesa el caso "ec-corp-andina". Dime qué campos quedaron llenos,
    cuáles faltan, si el paquete está listo para firma y qué soportes debo actualizar. No envíes nada todavía.</em></p>
  <div id="chat"></div>
  <form id="form">
    <textarea id="input" rows="2" placeholder="Escribe tu mensaje… (Enter para enviar)"></textarea>
    <button id="enviar" type="submit">Enviar</button>
  </form>
</main>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const btn = document.getElementById("enviar");
  let sessionId = null;

  // Salud del backend (sin exponer la clave).
  fetch("/api/health").then(r => r.json()).then(d => {
    document.getElementById("dot").className = "dot " + (d.ok ? "ok" : "no");
    document.getElementById("salud-txt").textContent = `${d.provider} · ${d.model}`;
  }).catch(() => {
    document.getElementById("dot").className = "dot no";
    document.getElementById("salud-txt").textContent = "backend no disponible";
  });

  function burbuja(texto, clase) {
    const d = document.createElement("div");
    d.className = "msg " + clase;
    d.textContent = texto;
    chat.appendChild(d);
    scroll();
    return d;
  }

  function tarjetaHerramienta(tc) {
    const d = document.createElement("div");
    d.className = "tool" + (tc.ok ? "" : " err");
    const head = document.createElement("div");
    head.className = "t-head";
    head.innerHTML = `<code>${tc.nombre}</code><span class="estado">${tc.ok ? "ok" : "error"}</span>`;
    d.appendChild(head);
    const pre = document.createElement("pre");
    pre.textContent = "args: " + JSON.stringify(tc.args) + "\n→ " + tc.resumen;
    d.appendChild(pre);
    chat.appendChild(d);
    scroll();
  }

  function scroll() { window.scrollTo(0, document.body.scrollHeight); }

  async function enviar(mensaje) {
    burbuja(mensaje, "user");
    input.value = "";
    btn.disabled = true;
    const pensando = document.createElement("div");
    pensando.className = "pensando";
    pensando.textContent = "pensando…";
    chat.appendChild(pensando);
    scroll();

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ sessionId, message: mensaje }),
      });
      const d = await r.json();
      pensando.remove();
      sessionId = d.sessionId || sessionId;
      (d.toolCalls || []).forEach(tarjetaHerramienta);
      const b = burbuja(d.reply || "(sin respuesta)", "bot" + (d.needsConfirmation ? " confirm" : ""));
      if (d.needsConfirmation) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "REQUIERE CONFIRMACIÓN";
        b.prepend(badge);
        agregarAccionesConfirm(b);
      }
    } catch (e) {
      pensando.remove();
      burbuja("Error de red al hablar con el backend.", "bot");
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  function agregarAccionesConfirm(bubble) {
    const cont = document.createElement("div");
    cont.className = "confirm-acciones";
    const si = document.createElement("button");
    si.textContent = "Sí, confirmo";
    si.onclick = () => { cont.remove(); enviar("Sí, confirmo. Envía."); };
    const no = document.createElement("button");
    no.className = "sec";
    no.textContent = "No por ahora";
    no.onclick = () => { cont.remove(); enviar("No, no envíes todavía."); };
    cont.append(si, no);
    bubble.appendChild(cont);
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const m = input.value.trim();
    if (m) enviar(m);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
</script>
</body>
</html>
