# Blueprint de despliegue en Render (https://render.com).
# Con el repo conectado, crea un Web Service y pide la clave como variable secreta.
services:
  - type: web
    name: agente-registro-proveedor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false   # se ingresa en el panel de Render, nunca en el repo
